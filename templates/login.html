<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QuickChat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <img src="/static/logo.webp" alt="Logo" class="logo">
        <h1>QuickChat</h1>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" class="form-input" placeholder="Tu usuario" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-input" placeholder="Tu contraseña" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn">Iniciar sesión</button>

                <p id="error-message" class="error-message" style="display: none;"></p>

                <p class="auth-footer">
                    ¿No tienes cuenta? <a href="/register" id="register-link">Regístrate aquí</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch('/api/auth/config');
                if (response.ok) {
                    const config = await response.json();
                    if (!config.allow_registration) {
                        const registerLink = document.getElementById('register-link');
                        if (registerLink) {
                            registerLink.parentElement.style.display = 'none';
                        }
                    }
                }
            } catch (err) {
                console.error('Error fetching config:', err);
            }
        });

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');
            const submitBtn = this.querySelector('button[type="submit"]');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Conectando...';
            errorMsg.style.display = 'none';

            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData,
                    credentials: 'same-origin'
                });

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    const error = await response.json();
                    errorMsg.textContent = error.detail || 'Credenciales inválidas';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Error de conexión. Intenta de nuevo.';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Iniciar sesión';
            }
        });
    </script>
</body>
</html>
